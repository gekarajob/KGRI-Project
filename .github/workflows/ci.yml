name: Portal checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API checks and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # These credentials are synthetic and apply only to this disposable CI service.
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: kgri_test
          POSTGRES_USER: kgri_test
          POSTGRES_PASSWORD: isolated-ci-test-password
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kgri_test -d kgri_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kgri_test:isolated-ci-test-password@127.0.0.1:5432/kgri_test
      JWT_SECRET: isolated-ci-test-signing-key-at-least-32-characters
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Python lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check Python types
        run: python -m mypy config apps
      - name: Run API integration tests
        run: python -m pytest

  frontend:
    name: Frontend checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and lint
        run: |
          npm run check
          npm run lint
      - name: Build production assets
        run: npm run build
